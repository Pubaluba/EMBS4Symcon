name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linter-Tests
        run: python3 -m unittest discover -s tests/lint -v
      - name: Symcon-Lint (Warnungen sind Fehler)
        run: python3 .dev/symcon_lint.py --strict
      - name: Release-Pruefung gegen den Hauptzweig (nur Pull Requests)
        if: github.event_name == 'pull_request'
        run: python3 .dev/symcon_lint.py --base origin/${{ github.base_ref }}
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Syntaxcheck
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Tests ohne PHPUnit (32 MB)
        run: php -d memory_limit=32M .dev/run_php_tests.php
      - run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: Speichertest 32 MB (Lib-Tests)
        run: php -d memory_limit=32M vendor/bin/phpunit
